[project]
name = "gha-demo"
version = "0.1.0"
description = "A minimal Flask API used to demonstrate a GitHub Actions CI pipeline."
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gha_demo*"]

[tool.ruff]
line-length = 88    # set the maximum line length for code formatting

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle errors, pyflakes, isort

[tool.pytest.ini_options]
testpaths = ["tests"]
